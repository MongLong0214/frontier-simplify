<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 124" width="720" height="124" role="img" aria-labelledby="ss-t ss-d">
  <title id="ss-t">Frontier-simplify</title>
  <desc id="ss-d">A pair of scissors snipping continuously, beside the wordmark frontier-simplify.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h1, .h2 { transform-box: view-box; transform-origin: 152px 62px; }
    .h1 { animation: snip1 1.6s ease-in-out infinite }
    .h2 { animation: snip2 1.6s ease-in-out infinite }
    @keyframes snip1 {
      0%, 100% { transform: rotate(-13deg) }
      45%      { transform: rotate(-1.5deg) }
      55%      { transform: rotate(-1.5deg) }
    }
    @keyframes snip2 {
      0%, 100% { transform: rotate(13deg) }
      45%      { transform: rotate(1.5deg) }
      55%      { transform: rotate(1.5deg) }
    }
    @media (prefers-reduced-motion: reduce) {
      .h1 { animation: none !important; transform: rotate(-9deg) }
      .h2 { animation: none !important; transform: rotate(9deg) }
    }
  </style>

  <!-- half 1: 위쪽 날 + 아래쪽 손잡이 -->
  <g class="h1">
    <path d="M 154 57 C 118 51, 72 46.5, 44 50 C 36.5 51, 36 56.5, 44 57.5 C 92 62.5, 132 62.5, 154 65 Z" fill="#1f1f1f"/>
    <path d="M 152 62 C 162 66, 170 70, 177 75" fill="none" stroke="#e05d52" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="192" cy="86" rx="17" ry="12.5" fill="none" stroke="#e05d52" stroke-width="6.5" transform="rotate(32 192 86)"/>
  </g>

  <!-- half 2: 아래쪽 날 + 위쪽 손잡이 -->
  <g class="h2">
    <path d="M 154 67 C 118 73, 72 77.5, 44 74 C 36.5 73, 36 67.5, 44 66.5 C 92 61.5, 132 61.5, 154 59 Z" fill="#1f1f1f"/>
    <path d="M 152 62 C 162 58, 170 54, 177 49" fill="none" stroke="#e05d52" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="192" cy="38" rx="17" ry="12.5" fill="none" stroke="#e05d52" stroke-width="6.5" transform="rotate(-32 192 38)"/>
  </g>

  <!-- 피벗 나사 -->
  <circle cx="152" cy="62" r="5" fill="#1f1f1f"/>
  <circle cx="152" cy="62" r="1.8" fill="#e05d52"/>

  <text x="248" y="78" fill="#1f1f1f" font-size="46" font-weight="650" letter-spacing="0.5">Frontier-<tspan fill="#e05d52">simplify</tspan></text>
</svg>
