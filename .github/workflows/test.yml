name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Git context and literal filenames
        run: python3 -B skills/frontier-simplify-review/scripts/selftest-git.py
      - name: Source index and installed hook
        run: python3 -B skills/frontier-simplify-review/scripts/selftest-index.py
      - name: Full offline selftest
        run: env -u REVIEW_SELFTEST_FAST bash skills/frontier-simplify-review/scripts/selftest.sh
